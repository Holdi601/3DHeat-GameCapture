<text x="16" y="208" fill="#d6d9df">&#160;&#160;&#160;&#160;train&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;train&#160;a&#160;per-map&#160;place&#160;model&#160;on&#160;renders&#160;of&#160;the&#160;level</text>
